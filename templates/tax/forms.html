{% extends 'base_app.html' %}

{% block title %}{{ t.tax_forms }} — {{ t.brand }}{% endblock %}

{% block content %}
<h1 class="page-title">{{ t.tax_forms }}</h1>
<p class="page-sub">{{ t.mod_tax }} · my.soliq.uz</p>

<div class="report-grid">
  {% for f in forms %}
  <article class="report-card">
    <h3>{{ f.name }}</h3>
    <p>Kod: {{ f.code }} · {{ f.period }}</p>
    <button class="btn btn-primary btn-sm">{{ t.create }}</button>
  </article>
  {% endfor %}
</div>
<p class="muted-note">{{ t.placeholder }}</p>
{% endblock %}
