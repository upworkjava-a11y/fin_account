{% extends 'base_app.html' %}

{% block title %}{{ t.tax_forming }} — {{ t.brand }}{% endblock %}

{% block content %}
<h1 class="page-title">{{ t.tax_forming }}</h1>
<p class="page-sub">Soliq to‘lovchisi turi: <strong>{{ tax_type }}</strong></p>

<div class="report-grid">
  {% for r in reports %}
  <article class="report-card">
    <h3>{{ r.title }}</h3>
    <p>{{ r.period }}</p>
    <span class="badge">{{ r.status }}</span>
    <div style="margin-top:0.75rem">
      <button class="btn btn-primary btn-sm">{{ t.create }}</button>
    </div>
  </article>
  {% endfor %}
</div>
{% endblock %}
